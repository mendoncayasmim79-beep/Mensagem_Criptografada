<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cifra. — sistema de mensagens cifradas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0F1428;--bg-grad:#141B36;--panel:#1A2142;--panel-alt:#212A50;--paper:#F4EFE2;--paper-ink:#20190F;--paper-ink-dim:#6B6252;--brass:#C89B4D;--brass-bright:#E0B667;--brass-dim:#8C7038;--teal:#4FD1AE;--danger:#E2645A;--text:#ECEEF7;--text-dim:#949CC4;--border:#2C3562;--border-soft:#242C54;--r-card:20px;--r-input:10px;--font-display:'Spectral',serif;--font-ui:'Inter',sans-serif;--font-mono:'IBM Plex Mono',monospace}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(circle at 15% -10%,#1B2450 0%,transparent 55%),radial-gradient(circle at 110% 10%,#182047 0%,transparent 45%),var(--bg);color:var(--text);font-family:var(--font-ui);min-height:100vh;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);position:relative;overflow-x:hidden}
::selection{background:var(--brass);color:#1a1305}

/* Canvas da Matriz de Fundo */
#matrixCanvas{position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:0;opacity:0.12}

.shell{max-width:720px;margin:0 auto;padding:28px 20px 60px;position:relative;z-index:1}
header.appbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:26px}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{flex-shrink:0}
.brand-text h1{font-family:var(--font-display);font-weight:600;font-size:1.5rem;margin:0;letter-spacing:0.2px;color:var(--text)}
.brand-text p{margin:1px 0 0;font-size:0.75rem;color:var(--text-dim);font-family:var(--font-mono)}
.session-pill{display:flex;align-items:center;gap:10px;font-size:0.85rem;color:var(--text-dim)}
.session-pill strong{color:var(--brass-bright);font-weight:600}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text-dim);padding:6px 12px;border-radius:999px;font-size:0.78rem;font-family:var(--font-ui);cursor:pointer;transition:all .2s ease}
.btn-ghost:hover{border-color:var(--brass);color:var(--brass-bright);box-shadow:0 0 10px rgba(200,155,77,0.3)}

.card{background:linear-gradient(180deg,var(--panel),var(--panel-alt));border:1px solid var(--border-soft);border-radius:var(--r-card);padding:30px 28px;box-shadow:0 20px 50px -25px rgba(0,0,0,.6);position:relative}
.card + .card{margin-top:16px}
.card-header-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.card h2{font-family:var(--font-display);font-weight:600;font-size:1.35rem;margin:0 0 6px}
.card .lead{color:var(--text-dim);font-size:0.9rem;margin:0 0 22px;line-height:1.5}
label{display:block;font-size:0.78rem;color:var(--text-dim);margin-bottom:6px;font-weight:500}

/* Estilos de Badges */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:6px;font-family:var(--font-mono);font-size:0.68rem;font-weight:600;letter-spacing:0.3px;text-transform:uppercase}
.badge-brass{background:rgba(200,155,77,0.15);border:1px solid rgba(200,155,77,0.4);color:var(--brass-bright)}
.badge-teal{background:rgba(79,209,174,0.15);border:1px solid rgba(79,209,174,0.4);color:var(--teal)}
.badge-purple{background:rgba(147,112,219,0.15);border:1px solid rgba(147,112,219,0.4);color:#b39ddb}

input[type="text"],input[type="email"],input[type="password"],input[type="number"],textarea,select{width:100%;background:#131A38;border:1px solid var(--border);color:var(--text);padding:11px 13px;border-radius:var(--r-input);font-family:var(--font-ui);font-size:0.92rem;outline:none;transition:all .2s ease}
textarea{resize:vertical;min-height:90px;line-height:1.5}
input:focus,textarea:focus,select:focus{border-color:var(--brass);box-shadow:0 0 12px rgba(200,155,77,0.35)}

.field{margin-bottom:16px}
.field-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.field-header label{margin-bottom:0}
.byte-counter{font-family:var(--font-mono);font-size:0.75rem;color:var(--text-dim);background:#131A38;padding:3px 8px;border-radius:6px;border:1px solid var(--border)}
.byte-counter strong{color:var(--brass-bright)}

/* Botões com efeito Glow Neon */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:var(--r-input);padding:12px 20px;font-family:var(--font-ui);font-weight:600;font-size:0.92rem;cursor:pointer;transition:all .2s ease}
.btn-primary{background:var(--brass);color:#241A06}
.btn-primary:hover{background:var(--brass-bright);box-shadow:0 0 20px rgba(200,155,77,0.6);transform:translateY(-1px)}
.btn-secondary{background:var(--panel-alt);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{border-color:var(--brass);box-shadow:0 0 12px rgba(200,155,77,0.25)}
.btn-teal{background:var(--teal);color:#062A22}
.btn-teal:hover{filter:brightness(1.1);box-shadow:0 0 20px rgba(79,209,174,0.6);transform:translateY(-1px)}
.btn-danger{background:transparent;color:var(--danger);border:1px solid rgba(226,100,90,.4)}
.btn-danger:hover{background:rgba(226,100,90,.1);box-shadow:0 0 12px rgba(226,100,90,0.3)}
.btn[disabled]{opacity:0.4;cursor:not-allowed;box-shadow:none !important;transform:none !important}
.btn-block{width:100%}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}

.menu-list{display:flex;flex-direction:column;gap:10px}
.menu-tile{display:flex;align-items:center;gap:14px;background:#151C3C;border:1px solid var(--border-soft);border-radius:14px;padding:16px 18px;cursor:pointer;text-align:left;color:var(--text);transition:all .2s ease;font-family:var(--font-ui)}
.menu-tile:hover{border-color:var(--brass);background:#182047;box-shadow:0 0 15px rgba(200,155,77,0.2)}
.menu-tile .icon{width:38px;height:38px;border-radius:10px;background:rgba(200,155,77,0.12);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.menu-tile .t{font-weight:600;font-size:0.95rem}
.menu-tile .d{font-size:0.78rem;color:var(--text-dim);margin-top:1px}
.menu-tile .arrow{margin-left:auto;color:var(--text-dim)}

.stepper{display:flex;align-items:center;margin-bottom:26px;gap:0}
.stepper .step{display:flex;align-items:center;gap:8px;font-size:0.76rem;color:var(--text-dim);font-family:var(--font-mono)}
.stepper .dot{width:22px;height:22px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:0.68rem;color:var(--text-dim);flex-shrink:0}
.stepper .step.done .dot{background:var(--teal);border-color:var(--teal);color:#062A22}
.stepper .step.active .dot{background:var(--brass);border-color:var(--brass);color:#241A06}
.stepper .step.active{color:var(--text)}
.stepper .step.done{color:var(--text-dim)}
.stepper .line{flex:1;height:1px;background:var(--border);margin:0 8px;min-width:14px}
.stepper .line.done{background:var(--teal)}

.paper{background:var(--paper);color:var(--paper-ink);border-radius:12px;padding:20px 22px;font-family:var(--font-display);font-size:1.05rem;line-height:1.6;white-space:pre-wrap;word-break:break-word;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)}
.paper-meta{display:flex;justify-content:space-between;gap:10px;font-family:var(--font-mono);font-size:0.72rem;color:var(--paper-ink-dim);margin-top:10px}

details.tech{margin-top:18px;border:1px dashed var(--border);border-radius:12px;overflow:hidden}
details.tech summary{cursor:pointer;list-style:none;padding:12px 16px;display:flex;align-items:center;gap:8px;font-size:0.82rem;color:var(--brass-bright);font-weight:600;user-select:none}
details.tech summary::-webkit-details-marker{display:none}
details.tech summary .chev{transition:transform .15s;color:var(--text-dim)}
details.tech[open] summary .chev{transform:rotate(90deg)}
.tech-body{padding:4px 16px 18px;font-family:var(--font-mono);font-size:0.76rem;color:var(--text-dim)}
.tech-body h4{color:var(--text);font-family:var(--font-ui);font-size:0.78rem;margin:14px 0 6px;font-weight:600}
.tech-body h4:first-child{margin-top:0}

.bytes-wrap{display:flex;flex-wrap:wrap;gap:4px;background:#0E1330;border:1px solid var(--border-soft);border-radius:8px;padding:10px;margin-top:4px}
.byte-chip{background:#1A2142;border:1px solid var(--border);border-radius:5px;padding:2px 6px;font-size:0.7rem;transition:all 0.15s ease}
.byte-chip.hi{background:rgba(200,155,77,0.18);border-color:var(--brass-dim);color:var(--brass-bright);box-shadow:0 0 6px rgba(200,155,77,0.2)}

.tree-row{display:flex;gap:6px;flex-wrap:wrap;background:#0E1330;border:1px solid var(--border-soft);border-radius:8px;padding:10px;margin-top:4px}
.order-grid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:560px){.order-grid{grid-template-columns:1fr 1fr 1fr}}
.order-card{background:#151C3C;border:1px solid var(--border-soft);border-radius:12px;padding:14px;cursor:pointer;transition:all .2s ease}
.order-card:hover{border-color:var(--brass-dim)}
.order-card.selected{border-color:var(--brass);background:rgba(200,155,77,0.08);box-shadow:0 0 15px rgba(200,155,77,0.2)}
.order-card .ot{font-weight:600;font-size:0.86rem;margin-bottom:4px}
.order-card .op{font-family:var(--font-mono);font-size:0.7rem;color:var(--text-dim);word-break:break-all;line-height:1.5}

.hist-entry{border-left:2px solid var(--border);padding:4px 0 4px 16px;margin-bottom:14px;position:relative}
.hist-entry::before{content:"";position:absolute;left:-5px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--brass)}
.hist-entry.lida::before{background:var(--teal)}
.hist-entry .hid{font-family:var(--font-mono);font-size:0.7rem;color:var(--text-dim)}
.hist-entry .hmain{font-size:0.88rem;margin-top:3px}
.hist-entry .hmain b{color:var(--brass-bright);font-weight:600}
.hist-entry .hmsg{margin-top:6px;font-family:var(--font-display);font-style:italic;color:var(--text-dim);font-size:0.9rem}

.empty{text-align:center;padding:40px 10px;color:var(--text-dim)}
.back-link{display:inline-flex;align-items:center;gap:6px;color:var(--text-dim);font-size:0.82rem;background:none;border:none;cursor:pointer;padding:0;margin-bottom:18px;font-family:var(--font-ui)}
.back-link:hover{color:var(--brass-bright)}
footer.foot{text-align:center;margin-top:30px;font-size:0.72rem;color:var(--text-dim);font-family:var(--font-mono)}

#toast-container{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:10px;max-width:320px;pointer-events:none}
.toast{pointer-events:auto;background:var(--panel);border:1px solid var(--border);color:var(--text);padding:12px 16px;border-radius:10px;font-size:0.85rem;box-shadow:0 10px 30px rgba(0,0,0,0.5);display:flex;align-items:center;gap:10px;animation:toastIn 0.25s forwards}
.toast.ok{border-color:var(--teal);background:#12282B;box-shadow:0 0 15px rgba(79,209,174,0.3)}
.toast.err{border-color:var(--danger);background:#2B161B;box-shadow:0 0 15px rgba(226,100,90,0.3)}
.toast.info{border-color:var(--brass);background:#231E19;box-shadow:0 0 15px rgba(200,155,77,0.3)}
.toast.out{opacity:0;transform:translateY(-10px) scale(0.95)}
@keyframes toastIn{from{opacity:0;transform:translateY(-15px) scale(0.9)}to{opacity:1;transform:translateY(0) scale(1)}}
</style>
</head>
<body>
<!-- Canvas da Matriz -->
<canvas id="matrixCanvas"></canvas>

<div id="toast-container"></div>
<div class="shell">
<header class="appbar">
<div class="brand">
<svg width="40" height="40" viewBox="0 0 40 40" fill="none">
<circle cx="20" cy="20" r="18.5" stroke="#C89B4D" stroke-width="1.2"/>
<circle cx="20" cy="20" r="13" stroke="#C89B4D" stroke-width="1" opacity="0.55"/>
<circle cx="20" cy="20" r="2.4" fill="#C89B4D"/>
<g stroke="#C89B4D" stroke-width="1.2" opacity="0.85">
<line x1="20" y1="1.5" x2="20" y2="6.5"/>
<line x1="20" y1="33.5" x2="20" y2="38.5"/>
<line x1="1.5" y1="20" x2="6.5" y2="20"/>
<line x1="33.5" y1="20" x2="38.5" y2="20"/>
</g>
<path d="M20 9 L20 20 L28 24" stroke="#E0B667" stroke-width="1.4" stroke-linecap="round" fill="none"/>
</svg>
<div class="brand-text">
<h1>cifra.</h1>
<p>sistema de mensagens cifradas</p>
</div>
</div>
<div class="session-pill" id="sessionPill"></div>
</header>
<div id="app"></div>
<footer class="foot">árvore binária de busca (BST) + cifra XOR — execução 100% local no navegador</footer>
</div>

<script>
/* --- SCRIPT DA MATRIZ DE FUNDO SUAVE --- */
const canvas = document.getElementById('matrixCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const chars = '0123456789ABCDEF░▒▓<>/\\{}[]*&^%$#@!';
const fontSize = 14;
let columns = Math.floor(canvas.width / fontSize);
let drops = Array(columns).fill(1);

function drawMatrix() {
  ctx.fillStyle = 'rgba(15, 20, 40, 0.15)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  ctx.fillStyle = '#4FD1AE';
  ctx.font = fontSize + 'px "IBM Plex Mono", monospace';
  
  for (let i = 0; i < drops.length; i++) {
    const text = chars.charAt(Math.floor(Math.random() * chars.length));
    ctx.fillText(text, i * fontSize, drops[i] * fontSize);
    
    if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
      drops[i] = 0;
    }
    drops[i]++;
  }
}
setInterval(drawMatrix, 60);

/* --- LÓGICA DA APLICAÇÃO --- */
const MAX_USUARIOS = 2;
const TAMANHO_MAXIMO = 5000;
const STORAGE_KEY = "cifra_sistema_v1";

function showToast(msg, tipo = "info") {
  const container = document.getElementById("toast-container");
  const toast = document.createElement("div");
  toast.className = `toast ${tipo}`;
  toast.innerHTML = `<span>${esc(msg)}</span>`;
  container.appendChild(toast);
  setTimeout(() => {
    toast.classList.add("out");
    setTimeout(() => toast.remove(), 200);
  }, 3200);
}

function derivarChave(senha, id, contexto = "msg") {
  const base = `${senha}_${id}_${contexto}`;
  let hash = 0;
  for (let i = 0; i < base.length; i++) {
    hash = (hash << 5) - hash + base.charCodeAt(i);
    hash |= 0;
  }
  return `chave_${Math.abs(hash)}_${base}`;
}

function inserirNo(raiz, dado, posicao) {
  if (raiz === null) return { dado, posicao, esquerda: null, direita: null };
  if (dado < raiz.dado) raiz.esquerda = inserirNo(raiz.esquerda, dado, posicao);
  else raiz.direita = inserirNo(raiz.direita, dado, posicao);
  return raiz;
}
function gerarArvore(bytes) {
  let raiz = null;
  for (let i = 0; i < bytes.length; i++) raiz = inserirNo(raiz, bytes[i], i);
  return raiz;
}
function preOrdem(no, out) { if (!no) return; out.push(no); preOrdem(no.esquerda, out); preOrdem(no.direita, out); }
function emOrdem(no, out) { if (!no) return; emOrdem(no.esquerda, out); out.push(no); emOrdem(no.direita, out); }
function posOrdem(no, out) { if (!no) return; posOrdem(no.esquerda, out); posOrdem(no.direita, out); out.push(no); }
function percorrer(raiz, ordem) {
  const out = [];
  if (ordem === 1) preOrdem(raiz, out);
  else if (ordem === 2) emOrdem(raiz, out);
  else posOrdem(raiz, out);
  return out;
}
function xorCrypt(bytes, chave) {
  const k = Array.from(chave).map(c => c.charCodeAt(0));
  if (k.length === 0) return bytes.slice();
  return bytes.map((b, i) => b ^ k[i % k.length]);
}

function textoParaBytes(texto) { return Array.from(new TextEncoder().encode(texto)); }
function bytesParaTexto(bytes) { return new TextDecoder().decode(new Uint8Array(bytes)); }

function estadoPadrao() { return { usuarios: [], mensagens: {}, historico: [] }; }
function carregarEstado() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return estadoPadrao();
    const parsed = JSON.parse(raw);
    return { usuarios: parsed.usuarios || [], mensagens: parsed.mensagens || {}, historico: parsed.historico || [] };
  } catch (e) { return estadoPadrao(); }
}
function salvarEstado() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); }
  catch (e) { console.error("Falha ao salvar estado:", e); }
}

let DB = carregarEstado();

function proximoIdMensagem() {
  let id = 1;
  while (DB.mensagens[id] !== undefined) id++;
  return id;
}

function salvarMensagem(texto, ordem, id) {
  const chaveMsg = derivarChave(state.usuarioLogado.senha, id, "msg");
  const bytes = textoParaBytes(texto);
  const raiz = gerarArvore(bytes);
  const seq = percorrer(raiz, ordem);
  const dados = seq.map(n => n.dado);
  const posicoes = seq.map(n => n.posicao);
  const dadosCripto = xorCrypt(dados, chaveMsg);
  DB.mensagens[id] = { id, tamanho: bytes.length, ordem, posicoes, dados: dadosCripto };
  salvarEstado();
  return DB.mensagens[id];
}

function carregarMensagem(id, senhaAutenticada) {
  const arq = DB.mensagens[id];
  if (!arq) return null;
  const chaveMsg = derivarChave(senhaAutenticada, id, "msg");
  const dadosDecripto = xorCrypt(arq.dados, chaveMsg);
  const original = new Array(arq.tamanho);
  for (let i = 0; i < arq.tamanho; i++) original[arq.posicoes[i]] = dadosDecripto[i];
  try {
    return { ...arq, texto: bytesParaTexto(original) };
  } catch(e) {
    return null;
  }
}

function salvarHistorico(registro) {
  const chaveHist = derivarChave(state.usuarioLogado.senha, DB.historico.length + 1, "hist");
  const linha = [
    registro.idMensagem,
    registro.nomeRemetente || "",
    registro.nomeLeitor || "",
    registro.enviada ? 1 : 0,
    registro.lida ? 1 : 0,
    registro.mensagem || ""
  ].join("|");
  const bytes = textoParaBytes(linha);
  const cripto = xorCrypt(bytes, chaveHist);
  DB.historico.push({ tamanho: bytes.length, dados: cripto });
  salvarEstado();
}

function registrarEnvio(idMensagem, nomeRemetente, mensagem) {
  salvarHistorico({ idMensagem, nomeRemetente, nomeLeitor: "", enviada: 1, lida: 0, mensagem });
}
function registrarLeitura(idMensagem, nomeLeitor) {
  salvarHistorico({ idMensagem, nomeRemetente: "", nomeLeitor, enviada: 0, lida: 1, mensagem: "" });
}

function separarRegistro(linha) {
  const partes = linha.split("|");
  if (partes.length < 6) return null;
  return {
    idMensagem: parseInt(partes[0], 10),
    nomeRemetente: partes[1],
    nomeLeitor: partes[2],
    enviada: partes[3] === "1",
    lida: partes[4] === "1",
    mensagem: partes.slice(5).join("|")
  };
}

function visualizarHistorico() {
  return DB.historico.map((reg, idx) => {
    const chaveHist = derivarChave(state.usuarioLogado.senha, idx + 1, "hist");
    const bytes = xorCrypt(reg.dados, chaveHist);
    try {
      const linha = bytesParaTexto(bytes);
      return separarRegistro(linha);
    } catch(e) { return null; }
  }).filter(Boolean);
}

function cadastrarUsuario(nome, email, senha) {
  DB.usuarios.push({ nome, email, senha });
  salvarEstado();
}
function fazerLogin(email, senha) {
  return DB.usuarios.find(u => u.email === email && u.senha === senha) || null;
}

function hex(b) { return b.toString(16).padStart(2, "0").toUpperCase(); }
function charLabel(b) {
  if (b === 32) return "␠";
  if (b < 32 || b === 127) return "·";
  return String.fromCharCode(b);
}

function bytesChips(bytes, highlightAll) {
  return `<div class="bytes-wrap">${bytes.map(b =>
    `<span class="byte-chip${highlightAll ? " hi" : ""}">${hex(b)}</span>`
  ).join("")}</div>`;
}

function nomeOrdem(o) { return o === 1 ? "Pré-ordem" : o === 2 ? "Em-ordem" : "Pós-ordem"; }
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }

const state = {
  view: "boot",
  usuarioLogado: null,
  escrever: null,
  ler: { autenticado: false, id: "", resultado: null, senhaAutenticada: "" },
  historico: { autenticado: false }
};

function ir(view, patch) {
  state.view = view;
  if (patch) Object.assign(state, patch);
  render();
}

function iniciar() {
  if (DB.usuarios.length < MAX_USUARIOS) { ir("cadastro"); }
  else { ir("login"); }
}

const app = document.getElementById("app");
const sessionPill = document.getElementById("sessionPill");

function render() {
  renderSessionPill();
  switch (state.view) {
    case "cadastro": return renderCadastro();
    case "login": return renderLogin();
    case "menuPrincipal": return renderMenuPrincipal();
    case "menuMensagens": return renderMenuMensagens();
    case "escrever-texto": return renderEscreverTexto();
    case "escrever-arvore": return renderEscreverArvore();
    case "escrever-ordem": return renderEscreverOrdem();
    case "escrever-confirmar": return renderEscreverConfirmar();
    case "ler-auth": return renderLerAuth();
    case "ler-id": return renderLerId();
    case "ler-resultado": return renderLerResultado();
    case "historico-auth": return renderHistoricoAuth();
    case "historico-lista": return renderHistoricoLista();
    default: return renderLogin();
  }
}

function renderSessionPill() {
  if (state.usuarioLogado) {
    sessionPill.innerHTML = `<span>conectado como <strong>${esc(state.usuarioLogado.nome)}</strong></span>
    <button class="btn-ghost" id="btnSair">sair</button>`;
    document.getElementById("btnSair")?.addEventListener("click", sair);
  } else {
    sessionPill.innerHTML = `<button class="btn-ghost" id="btnReset">reiniciar dados</button>`;
    document.getElementById("btnReset")?.addEventListener("click", resetarTudo);
  }
}

function resetarTudo() {
  localStorage.removeItem(STORAGE_KEY);
  DB = estadoPadrao();
  state.usuarioLogado = null;
  showToast("Dados reiniciados.", "info");
  iniciar();
}

function sair() {
  state.usuarioLogado = null;
  showToast("Sessão encerrada.", "info");
  ir("login");
}

function renderCadastro() {
  const n = DB.usuarios.length + 1;
  app.innerHTML = `
  <div class="card">
  <div class="card-header-row">
    <h2>Cadastro</h2>
    <span class="badge badge-brass">USUÁRIO ${n}/${MAX_USUARIOS}</span>
  </div>
  <p class="lead">O sistema exige ${MAX_USUARIOS} usuários cadastrados para operar com segurança.</p>
  <div class="field"><label>Nome</label><input type="text" id="cNome" placeholder="Ex: Ana Souza"></div>
  <div class="field"><label>Email</label><input type="email" id="cEmail" placeholder="ana@exemplo.com"></div>
  <div class="field"><label>Senha</label><input type="password" id="cSenha" placeholder="••••••••"></div>
  <div class="btn-row">
  <button class="btn btn-primary" id="btnCadastrar">Cadastrar usuário ${n}</button>
  </div>
  </div>`;
  document.getElementById("btnCadastrar").addEventListener("click", () => {
    const nome = document.getElementById("cNome").value.trim();
    const email = document.getElementById("cEmail").value.trim();
    const senha = document.getElementById("cSenha").value;
    if (!nome || !email || !senha) return showToast("Preencha todos os campos.", "err");
    if (DB.usuarios.some(u => u.email === email)) return showToast("Email já cadastrado.", "err");
    cadastrarUsuario(nome, email, senha);
    showToast(`Usuário ${nome} cadastrado!`, "ok");
    if (DB.usuarios.length >= MAX_USUARIOS) ir("login");
    else renderCadastro();
  });
}

    <span class="badge badge-teal">AUTENTICAÇÃO</span>
  </div>

function stepperHtml(current) {
  const steps = ["Mensagem", "Árvore", "Ordem", "Confirmar"];
  return `<div class="stepper">${steps.map((s, i) => {
    const idx = i + 1;
    const cls = idx < current ? "done" : idx === current ? "active" : "";
    const mark = idx < current ? "✓" : idx;
    return `<div class="step ${cls}"><span class="dot">${mark}</span><span>${s}</span></div>${idx < steps.length ? `<div class="line ${idx < current ? "done" : ""}"></div>` : ""}`;
  }).join("")}</div>`;
}

function renderEscreverTexto() {
  app.innerHTML = `
  <button class="back-link" id="voltar">← voltar</button>
  <div class="card">
  ${stepperHtml(1)}
  <div class="card-header-row">
    <h2>Escrever mensagem</h2>
    <span class="badge badge-teal">UTF-8</span>
  </div>
  <p class="lead">Digite sua mensagem. O contador atualiza dinamicamente o número real de bytes.</p>
  <div class="field">
    <div class="field-header">
      <label>Texto da mensagem</label>
      <span class="byte-counter"><strong id="cntBytes">0</strong> / ${TAMANHO_MAXIMO} bytes</span>
    </div>
    <textarea id="txtMensagem" placeholder="Digite seu texto aqui...">${esc(state.escrever.texto)}</textarea>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="btnProximo">Gerar árvore →</button>
  </div>
  </div>`;

  const txtInput = document.getElementById("txtMensagem");
  const cnt = document.getElementById("cntBytes");

  const atualizarContador = () => {
    const totalBytes = textoParaBytes(txtInput.value).length;
    cnt.textContent = totalBytes;
  };

  txtInput.addEventListener("input", atualizarContador);
  atualizarContador();

  document.getElementById("voltar").addEventListener("click", () => ir("menuMensagens"));
  document.getElementById("btnProximo").addEventListener("click", () => {
    const texto = txtInput.value;
    if (!texto.trim()) return showToast("Digite uma mensagem primeiro.", "err");
    state.escrever.texto = texto;
    state.escrever.raiz = gerarArvore(textoParaBytes(texto));
    ir("escrever-arvore");
  });
}

function renderEscreverArvore() {
  const pre = percorrer(state.escrever.raiz, 1);
  const em = percorrer(state.escrever.raiz, 2);
  const pos = percorrer(state.escrever.raiz, 3);
  const rowHtml = (arr) => arr.map(n => `<span class="byte-chip">${charLabel(n.dado)}<span style="opacity:.5">·${n.dado}</span></span>`).join("");
  
  app.innerHTML = `
  <button class="back-link" id="voltar">← voltar</button>
  <div class="card">
  ${stepperHtml(2)}
  <div class="card-header-row">
    <h2>Árvore Binária Gerada</h2>
    <span class="badge badge-brass">BST</span>
  </div>
  <p class="lead">Bytes organizados na árvore binária com base na ordem dos caracteres.</p>
  <div class="paper" style="font-family:var(--font-mono); font-size:0.85rem;">${esc(state.escrever.texto)}</div>
  <details class="tech" open>
  <summary><span class="chev">▸</span> Ver percursos da árvore</summary>
  <div class="tech-body">
  <h4>Pré-ordem</h4><div class="tree-row">${rowHtml(pre)}</div>
  <h4>Em-ordem</h4><div class="tree-row">${rowHtml(em)}</div>
  <h4>Pós-ordem</h4><div class="tree-row">${rowHtml(pos)}</div>
  </div>
  </details>
  <div class="btn-row">
  <button class="btn btn-primary" id="btnProximo">Escolher ordem →</button>
  </div>
  </div>`;
  document.getElementById("voltar").addEventListener("click", () => ir("escrever-texto"));
  document.getElementById("btnProximo").addEventListener("click", () => ir("escrever-ordem"));
}

function renderEscreverOrdem() {
  const opcoes = [1, 2, 3].map(o => {
    const seq = percorrer(state.escrever.raiz, o);
    return { o, preview: seq.map(n => charLabel(n.dado)).join("") };
  });

  app.innerHTML = `
  <button class="back-link" id="voltar">← voltar</button>
  <div class="card">
  ${stepperHtml(3)}
  <h2>Escolha a Ordem de Gravação</h2>
  <p class="lead">A ordem selecionada irá alterar a sequência lógica dos bytes.</p>
  <div class="order-grid">
  ${opcoes.map(op => `
  <div class="order-card${state.escrever.ordem === op.o ? " selected" : ""}" data-ordem="${op.o}">
  <div class="ot">${nomeOrdem(op.o)}</div>
  <div class="op">${esc(op.preview)}</div>
  </div>`).join("")}
  </div>
  <div class="btn-row">
  <button class="btn btn-primary" id="btnProximo" ${state.escrever.ordem ? "" : "disabled"}>Continuar →</button>
  </div>
  </div>`;

  document.getElementById("voltar").addEventListener("click", () => ir("escrever-arvore"));
  document.querySelectorAll(".order-card").forEach(card => {
    card.addEventListener("click", () => {
      state.escrever.ordem = parseInt(card.dataset.ordem, 10);
      renderEscreverOrdem();
    });
  });
  document.getElementById("btnProximo").addEventListener("click", () => ir("escrever-confirmar"));
}

function renderEscreverConfirmar() {
  const seq = percorrer(state.escrever.raiz, state.escrever.ordem);
  const dadosClaros = seq.map(n => n.dado);
  const idPrevisto = proximoIdMensagem();
  const chaveDinamica = derivarChave(state.usuarioLogado.senha, idPrevisto, "msg");
  const dadosCriptoTarget = xorCrypt(dadosClaros, chaveDinamica);

  app.innerHTML = `
  <button class="back-link" id="voltar">← voltar</button>
  <div class="card">
  ${stepperHtml(4)}
  <div class="card-header-row">
    <h2>Encriptar e Salvar</h2>
    <span class="badge badge-teal">CIFRA XOR</span>
  </div>
  <p class="lead">Ordem selecionada: <strong style="color:var(--brass-bright)">${nomeOrdem(state.escrever.ordem)}</strong>.</p>
  <details class="tech" open>
  <summary><span class="chev">▸</span> Painel da Cifra XOR</summary>
  <div class="tech-body">
  <h4>Bytes em claro</h4>
  ${bytesChips(dadosClaros, false)}
  <h4>Chave Dinâmica</h4>
  <div style="word-break:break-all;">${chaveDinamica}</div>
  <h4>Bytes Cifrados (Saída)</h4>
  <div class="bytes-wrap" id="cryptedWrap">
    ${state.escrever.criptografada ? dadosCriptoTarget.map(b => `<span class="byte-chip hi">${hex(b)}</span>`).join("") : `<span class="hint">Clique no botão "Encriptar" abaixo.</span>`}
  </div>
  </div>
  </details>
  <div class="btn-row">
  <button class="btn btn-teal" id="btnEncriptar" ${state.escrever.criptografada ? "disabled" : ""}>
    ${state.escrever.criptografada ? "✓ Encriptado" : "Encriptar"}
  </button>
  <button class="btn btn-primary" id="btnSalvar" ${state.escrever.criptografada ? "" : "disabled"}>Salvar</button>
  <button class="btn btn-secondary" id="btnCancelar">Cancelar</button>
  </div>
  </div>`;

  document.getElementById("voltar").addEventListener("click", () => ir("escrever-ordem"));
  document.getElementById("btnCancelar").addEventListener("click", () => ir("menuMensagens"));

  document.getElementById("btnEncriptar").addEventListener("click", () => {
    const btnEnc = document.getElementById("btnEncriptar");
    const wrap = document.getElementById("cryptedWrap");
    btnEnc.disabled = true;
    btnEnc.innerText = "Cifrando...";

    let ticks = 0;
    const timer = setInterval(() => {
      wrap.innerHTML = dadosCriptoTarget.map(() => {
        const randByte = Math.floor(Math.random() * 256);
        return `<span class="byte-chip hi">${hex(randByte)}</span>`;
      }).join("");

      ticks++;
      if (ticks >= 12) {
        clearInterval(timer);
        state.escrever.criptografada = true;
        wrap.innerHTML = dadosCriptoTarget.map(b => `<span class="byte-chip hi">${hex(b)}</span>`).join("");
        btnEnc.innerText = "✓ Encriptado";
        document.getElementById("btnSalvar").disabled = false;
        showToast("Cifra XOR aplicada com sucesso!", "ok");
      }
    }, 45);
  });

  document.getElementById("btnSalvar").addEventListener("click", () => {
    const id = proximoIdMensagem();
    salvarMensagem(state.escrever.texto, state.escrever.ordem, id);
    registrarEnvio(id, state.usuarioLogado.nome, state.escrever.texto);
    showToast(`Mensagem ${String(id).padStart(3, "0")} armazenada!`, "ok");
    ir("menuMensagens");
  });
}
